name: Release

# Cutting a release: tag it, and this produces the artefact the in-console
# updater installs.
#
#   git tag -a v1.4.0 -m "…what changed…"
#   git push origin v1.4.0
#
# The tag message becomes the release notes an operator reads before deciding
# whether to update now or on Saturday, so it is worth writing.

on:
  push:
    tags: ['v*']
  # For re-cutting an artefact when the tag is right and the build was not.
  #
  # NO `tag` INPUT. A reusable workflow called with `uses: ./…` runs at the
  # CALLER's ref, so a dispatch from a branch ran the gate against branch HEAD
  # while the build below packaged the input tag -- releasing a tag whose tests
  # nobody ran, which is the one thing this workflow exists to prevent.
  #
  # Run it from the tag instead: GitHub's ref picker lists tags, and then the
  # gate, the checkout and the artefact are all the same commit by
  # construction rather than by agreement.
  workflow_dispatch:

permissions:
  contents: write
  # For the image job below, which logs in to GHCR with GITHUB_TOKEN rather
  # than a separate secret -- a token scoped to this run, this repository,
  # and nothing else.
  packages: write

jobs:
  # A dispatch from a branch would build something that is not a release.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse anything that is not a tag
        # github.ref/ref_type/ref_name go through env rather than being
        # interpolated straight into the script below. `${{ }}` substitutes
        # BEFORE the shell ever sees the line, so a ref name containing a
        # shell metacharacter -- backticks, `$(...)` -- would be executed as
        # part of the workflow, not merely printed by it. A tag name is
        # attacker-reachable by anyone who can push a tag, which on some
        # repos is a wider set of people than can edit this workflow.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "This workflow builds a RELEASE, and $REF is not a tag." >&2
            echo "Re-run it with a tag selected as the ref." >&2
            exit 1
          fi
          case "$REF_NAME" in
            v*) : ;;
            *) echo "Tag $REF_NAME does not look like a release tag (v*)." >&2; exit 1 ;;
          esac

      # A release is cut from main. A tag on a side branch -- or on a commit
      # that never merged -- is a release of code that no review and no main
      # CI run ever saw, and the reuse check below would find nothing for it
      # anyway. Refused here, before anything is built, rather than left to
      # the gate to discover.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse a commit that is not on main
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is not reachable from main; a release is cut from main." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Has this exact commit ALREADY passed CI on main?
  #
  # A release tag is, nearly always, pushed at a commit that went through
  # ci.yml minutes or hours earlier as a push to main -- and re-running the
  # whole suite on it proves nothing that run did not. Same SHA means same
  # ci.yml, same tests, same code: the earlier green run IS this gate, run
  # once. So if one exists, `verify` below is skipped and the run it relied
  # on is named in the log and the job summary.
  #
  # What counts, and every condition is required:
  #   - ci.yml, in THIS repository (not a fork's copy of it);
  #   - head_sha equal to the tagged commit, exactly;
  #   - head_branch main, from a `push` or a `workflow_dispatch` -- never a
  #     pull_request run, whose code is the merge ref and not this commit;
  #   - status completed, conclusion success.
  #
  # FAIL SAFE: anything else -- no such run, a failed or cancelled one, one
  # still in progress, or the API call itself failing -- answers "no", and
  # `verify` runs the full suite exactly as it always has. This job never
  # fails the release, and it can only ever skip a gate for a green one.
  # ---------------------------------------------------------------------------
  prior-ci:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.look.outputs.passed }}
    steps:
      - name: Look for a green ci.yml run on main for this commit
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          echo "passed=false" >> "$GITHUB_OUTPUT"
          # The query narrows; the jq filter DECIDES. Every condition above is
          # re-checked on each run returned, so a query parameter the API
          # quietly ignored cannot widen what counts.
          if ! RUN=$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" \
                -f head_sha="$SHA" -f branch=main -f status=success -F per_page=100 \
                | jq -r --arg sha "$SHA" --arg repo "$REPO" '
                    [.workflow_runs[]
                      | select(.head_sha == $sha
                               and .head_branch == "main"
                               and (.event == "push" or .event == "workflow_dispatch")
                               and .status == "completed"
                               and .conclusion == "success"
                               and .repository.full_name == $repo
                               and .head_repository.full_name == $repo)]
                    | sort_by(.run_started_at) | last | .html_url // empty'); then
            echo "::warning::Could not ask the API for earlier CI runs; running the full suite."
            exit 0
          fi
          if [ -z "$RUN" ]; then
            echo "No green ci.yml run on main for $SHA; running the full suite."
            exit 0
          fi
          echo "::notice::$SHA already passed CI on main: $RUN -- not running it again."
          echo "Gate satisfied by an earlier CI run on main: $RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "passed=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The gate. An update button whose whole promise is "this was tested" must
  # not be able to install something that was not, so the release job depends
  # on the same suite CI runs and a red tag produces no artefact at all.
  #
  # `workflow_call` rather than a copy: a second, drifting definition of the
  # suite is how a release comes to be gated on checks nobody maintains.
  #
  # Skipped ONLY when `prior-ci` found a green run on main for this exact
  # commit. `!= 'true'` rather than `== 'false'`, so an empty or missing
  # answer runs the suite.
  # ---------------------------------------------------------------------------
  verify:
    needs: [guard, prior-ci]
    if: needs.prior-ci.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  # `always()` because a skipped `verify` would otherwise skip this job too,
  # and then the condition spells out the gate in full: the guard passed, and
  # EITHER the suite just ran green OR it was skipped because `prior-ci`
  # found it green on main. A cancelled or failed `verify`, or a `prior-ci`
  # that did not complete, releases nothing.
  build:
    needs: [guard, prior-ci, verify]
    if: >-
      always()
      && needs.guard.result == 'success'
      && needs.prior-ci.result == 'success'
      && (needs.verify.result == 'success'
          || (needs.verify.result == 'skipped' && needs.prior-ci.outputs.passed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # The tag's own message is the release notes, and a shallow checkout
          # does not have it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `packageManager` in package.json pins the version. A newer pnpm installs
      # without running build scripts for Prisma and argon2, reports success,
      # and leaves nothing able to reach the database.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # Generated, not committed. The client is derived from schema.prisma and
      # a stale one in the tarball is a client that disagrees with the
      # migrations shipped beside it.
      - run: pnpm db:generate

      # THE BUNDLE IS BUILT HERE, not on the target.
      #
      # Rebuilding on the host is right for a developer push and wrong for an
      # update: it would make every install depend on a build toolchain being
      # present and on a build succeeding at two in the morning, on a machine
      # with no console attached. A release carries a bundle that already
      # exists.
      - run: pnpm --filter @syntra/web build

      - name: Work out what this release is
        id: meta
        # See the guard job above for why this comes in through env rather
        # than being interpolated directly into the script.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REF_NAME"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Which migrations this release adds over the PREVIOUS tag. This is
          # the one fact that decides whether an operator updates during the
          # working day, so it is computed rather than remembered.
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            ADDED=$(git diff --name-only --diff-filter=A "$PREV" "$TAG" \
              -- packages/db/prisma/migrations \
              | awk -F/ '/migration.sql$/ {print $(NF-1)}' | sort -u)
          else
            ADDED=$(ls packages/db/prisma/migrations | grep -v migration_lock || true)
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          {
            echo 'migrations<<EOF'
            echo "$ADDED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write RELEASE.json and VERSION
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MIGRATIONS_RAW: ${{ steps.meta.outputs.migrations }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > VERSION
          MIGRATIONS=$(printf '%s\n' "$MIGRATIONS_RAW" \
            | sed '/^$/d' | jq -R . | jq -s .)
          jq -n \
            --arg version  "$VERSION" \
            --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit   "$COMMIT" \
            --argjson migrations "$MIGRATIONS" \
            '{version: $version, released: $released, commit: $commit, migrations: $migrations}' \
            > RELEASE.json
          cat RELEASE.json

      - name: Assemble the runtime tree
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The tracked tree MINUS what a running system has no use for --
          # PLUS the built bundle and the release metadata.
          #
          # The exclusions live in ops/release-excludes.txt, shared with
          # ops/rehearsal/make-release.sh, so a rehearsal against a
          # differently-shaped artefact does not rehearse a different feature.
          #
          # node_modules is deliberately NOT here. It is platform- and
          # architecture-specific, it would multiply the artefact by two orders
          # of magnitude, and `pnpm install --frozen-lockfile` on the target is
          # both faster and correct.
          mapfile -t EXCLUDES < ops/release-excludes.txt
          git ls-files -- . "${EXCLUDES[@]}" > /tmp/manifest.txt
          {
            cat /tmp/manifest.txt
            echo VERSION
            echo RELEASE.json
            find apps/web/dist -type f
          } | sort -u > /tmp/files.txt

          NAME="syntra-$VERSION"
          tar -czf "$NAME.tar.gz" --transform "s,^,$NAME/," -T /tmp/files.txt
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

          # Proof the thing is intact and contains what the updater will look
          # for. A tarball missing its bundle or its metadata is a release that
          # fails on the target instead of here.
          #
          # `grep -c`, not `-q`: this is under `set -o pipefail`, and `-q`
          # exits the instant it finds a match, closing the pipe while `tar
          # -tzf` may still be writing the rest of its listing -- tar then
          # dies of SIGPIPE and pipefail reports that as this line's failure,
          # even though grep matched and the tarball is fine. `-c` has to
          # read its input to the end to produce a count, so it never closes
          # the pipe early. This is the first tag this workflow was ever run
          # against, and it hit this every time.
          tar -tzf "$NAME.tar.gz" | grep -c "^$NAME/RELEASE.json$" >/dev/null
          tar -tzf "$NAME.tar.gz" | grep -c "^$NAME/apps/web/dist/index.html$" >/dev/null
          tar -tzf "$NAME.tar.gz" | grep -c "^$NAME/pnpm-lock.yaml$" >/dev/null
          ls -lh "$NAME.tar.gz"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NAME="syntra-$VERSION"
          # The tag's annotation is the notes. An empty one is allowed but
          # unhelpful, and shows as such in the console.
          git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            "$NAME.tar.gz" "$NAME.tar.gz.sha256"

  # ---------------------------------------------------------------------------
  # Container images, for `docker compose up` adopters -- see docker-compose.yml.
  # Depends on `build`, not just `verify`: `build` is the same job that just
  # produced the tarball the in-console updater installs, and a tag that
  # cannot pass that has no business becoming `:latest` either. Nothing here
  # reuses `build`'s checkout; each build-push-action call does its own,
  # pinned to the same tag by the same `ref: ${{ github.ref }}` guard.
  #
  # `always()` for the same reason as on `build`: a `verify` skipped because
  # `prior-ci` found the commit green would otherwise skip this job with it.
  # `build` succeeding already implies the gate held; it is spelled out anyway.
  # ---------------------------------------------------------------------------
  image:
    needs: [guard, prior-ci, verify, build]
    if: >-
      always()
      && needs.guard.result == 'success'
      && needs.prior-ci.result == 'success'
      && (needs.verify.result == 'success'
          || (needs.verify.result == 'skipped' && needs.prior-ci.outputs.passed == 'true'))
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Work out the version tag
        # Same rule as the guard job above: github.ref_name goes through env,
        # never straight into a script, because a tag name is reachable by
        # anyone who can push one.
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

          # WHICH TAGS MAY BECOME `:latest`, and this is narrower than the
          # guard job's `v*`.
          #
          # docker-compose.yml defaults to `${SYNTRA_VERSION:-latest}`, so
          # `:latest` is not a convenience alias here -- it is the image every
          # deployment that did not pin a version pulls on its next `up -d`.
          # Under `v*` alone, pushing `v2.0.0-rc1` or `v1.5.0-beta.2` to get a
          # release candidate built for one test host silently upgraded every
          # unpinned production stack to a pre-release. Nothing about that is
          # visible until it has happened.
          #
          # So: numeric components only. `v1.4.0` and `v2026.8` move `:latest`;
          # `v2.0.0-rc1`, `v1.4.0+build3` and `v1.4.0-hotfix` are published
          # under their own version tag and nothing else, which is exactly what
          # somebody cutting a candidate wants.
          #
          # `grep -Eq` rather than the guard's `case` glob because a shell glob
          # cannot express "digits, separated by dots, and nothing else" -- and
          # a pattern that only LOOKS strict is how a candidate reaches
          # production in the first place. REF_NAME still arrives through env.
          if printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF_NAME is a pre-release tag; not moving :latest"
          fi

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # The second line evaluates to the empty string for a pre-release
          # tag, and build-push-action drops empty entries from this list.
          tags: |
            ghcr.io/ssan9876/syntra-api:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest == 'true' && 'ghcr.io/ssan9876/syntra-api:latest' || '' }}
          cache-from: type=gha,scope=syntra-api
          cache-to: type=gha,mode=max,scope=syntra-api
          provenance: mode=max
          sbom: true

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # See the api step above for why `:latest` is conditional.
          tags: |
            ghcr.io/ssan9876/syntra-web:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.latest == 'true' && 'ghcr.io/ssan9876/syntra-web:latest' || '' }}
          cache-from: type=gha,scope=syntra-web
          cache-to: type=gha,mode=max,scope=syntra-web
          provenance: mode=max
          sbom: true
