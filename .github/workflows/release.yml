name: Release

# Cutting a release: tag it, and this produces the artefact the in-console
# updater installs.
#
#   git tag -a v1.4.0 -m "…what changed…"
#   git push origin v1.4.0
#
# The tag message becomes the release notes an operator reads before deciding
# whether to update now or on Saturday, so it is worth writing.

on:
  push:
    tags: ['v*']
  # For re-cutting an artefact when the tag is right and the build was not.
  #
  # NO `tag` INPUT. A reusable workflow called with `uses: ./…` runs at the
  # CALLER's ref, so a dispatch from a branch ran the gate against branch HEAD
  # while the build below packaged the input tag -- releasing a tag whose tests
  # nobody ran, which is the one thing this workflow exists to prevent.
  #
  # Run it from the tag instead: GitHub's ref picker lists tags, and then the
  # gate, the checkout and the artefact are all the same commit by
  # construction rather than by agreement.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A dispatch from a branch would build something that is not a release.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything that is not a tag
        # github.ref/ref_type/ref_name go through env rather than being
        # interpolated straight into the script below. `${{ }}` substitutes
        # BEFORE the shell ever sees the line, so a ref name containing a
        # shell metacharacter -- backticks, `$(...)` -- would be executed as
        # part of the workflow, not merely printed by it. A tag name is
        # attacker-reachable by anyone who can push a tag, which on some
        # repos is a wider set of people than can edit this workflow.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "This workflow builds a RELEASE, and $REF is not a tag." >&2
            echo "Re-run it with a tag selected as the ref." >&2
            exit 1
          fi
          case "$REF_NAME" in
            v*) : ;;
            *) echo "Tag $REF_NAME does not look like a release tag (v*)." >&2; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # The gate. An update button whose whole promise is "this was tested" must
  # not be able to install something that was not, so the release job depends
  # on the same suite CI runs and a red tag produces no artefact at all.
  #
  # `workflow_call` rather than a copy: a second, drifting definition of the
  # suite is how a release comes to be gated on checks nobody maintains.
  # ---------------------------------------------------------------------------
  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: [guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # The tag's own message is the release notes, and a shallow checkout
          # does not have it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `packageManager` in package.json pins the version. A newer pnpm installs
      # without running build scripts for Prisma and argon2, reports success,
      # and leaves nothing able to reach the database.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      # Generated, not committed. The client is derived from schema.prisma and
      # a stale one in the tarball is a client that disagrees with the
      # migrations shipped beside it.
      - run: pnpm db:generate

      # THE BUNDLE IS BUILT HERE, not on the target.
      #
      # Rebuilding on the host is right for a developer push and wrong for an
      # update: it would make every install depend on a build toolchain being
      # present and on a build succeeding at two in the morning, on a machine
      # with no console attached. A release carries a bundle that already
      # exists.
      - run: pnpm --filter @syntra/web build

      - name: Work out what this release is
        id: meta
        # See the guard job above for why this comes in through env rather
        # than being interpolated directly into the script.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REF_NAME"
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Which migrations this release adds over the PREVIOUS tag. This is
          # the one fact that decides whether an operator updates during the
          # working day, so it is computed rather than remembered.
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            ADDED=$(git diff --name-only --diff-filter=A "$PREV" "$TAG" \
              -- packages/db/prisma/migrations \
              | awk -F/ '/migration.sql$/ {print $(NF-1)}' | sort -u)
          else
            ADDED=$(ls packages/db/prisma/migrations | grep -v migration_lock || true)
          fi
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          {
            echo 'migrations<<EOF'
            echo "$ADDED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Write RELEASE.json and VERSION
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MIGRATIONS_RAW: ${{ steps.meta.outputs.migrations }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VERSION" > VERSION
          MIGRATIONS=$(printf '%s\n' "$MIGRATIONS_RAW" \
            | sed '/^$/d' | jq -R . | jq -s .)
          jq -n \
            --arg version  "$VERSION" \
            --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit   "$COMMIT" \
            --argjson migrations "$MIGRATIONS" \
            '{version: $version, released: $released, commit: $commit, migrations: $migrations}' \
            > RELEASE.json
          cat RELEASE.json

      - name: Assemble the runtime tree
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The tracked tree MINUS what a running system has no use for --
          # PLUS the built bundle and the release metadata.
          #
          # The exclusions live in ops/release-excludes.txt, shared with
          # ops/rehearsal/make-release.sh, so a rehearsal against a
          # differently-shaped artefact does not rehearse a different feature.
          #
          # node_modules is deliberately NOT here. It is platform- and
          # architecture-specific, it would multiply the artefact by two orders
          # of magnitude, and `pnpm install --frozen-lockfile` on the target is
          # both faster and correct.
          mapfile -t EXCLUDES < ops/release-excludes.txt
          git ls-files -- . "${EXCLUDES[@]}" > /tmp/manifest.txt
          {
            cat /tmp/manifest.txt
            echo VERSION
            echo RELEASE.json
            find apps/web/dist -type f
          } | sort -u > /tmp/files.txt

          NAME="syntra-$VERSION"
          tar -czf "$NAME.tar.gz" --transform "s,^,$NAME/," -T /tmp/files.txt
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

          # Proof the thing is intact and contains what the updater will look
          # for. A tarball missing its bundle or its metadata is a release that
          # fails on the target instead of here.
          #
          # `grep -c`, not `-q`: this is under `set -o pipefail`, and `-q`
          # exits the instant it finds a match, closing the pipe while `tar
          # -tzf` may still be writing the rest of its listing -- tar then
          # dies of SIGPIPE and pipefail reports that as this line's failure,
          # even though grep matched and the tarball is fine. `-c` has to
          # read its input to the end to produce a count, so it never closes
          # the pipe early. This is the first tag this workflow was ever run
          # against, and it hit this every time.
          tar -tzf "$NAME.tar.gz" | grep -c "^$NAME/RELEASE.json$" >/dev/null
          tar -tzf "$NAME.tar.gz" | grep -c "^$NAME/apps/web/dist/index.html$" >/dev/null
          tar -tzf "$NAME.tar.gz" | grep -c "^$NAME/pnpm-lock.yaml$" >/dev/null
          ls -lh "$NAME.tar.gz"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          NAME="syntra-$VERSION"
          # The tag's annotation is the notes. An empty one is allowed but
          # unhelpful, and shows as such in the console.
          git tag -l --format='%(contents)' "$TAG" > /tmp/notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            "$NAME.tar.gz" "$NAME.tar.gz.sha256"
