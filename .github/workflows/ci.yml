name: CI

# Everything this repository knows how to check, on every push and every pull
# request. Until this file existed, all of it depended on somebody remembering.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable from release.yml, so a tag is gated on exactly the checks a push
  # is. A second, drifting copy of this suite is how a release comes to be
  # gated on something nobody maintains.
  workflow_call:

concurrency:
  # A second push to the same branch cancels the first: a 30-minute suite that
  # queues behind two superseded runs is a suite people stop waiting for.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only, and generated rather than stored: nothing here protects anything.
  # MASTER_KEY must be 32 base64 bytes or the seed makes no SAML signing key.
  SEED_ADMIN_PASSWORD: a-long-enough-admin-password
  SEED_USER_PASSWORD: a-long-enough-user-password

  # TWO, and this number was measured rather than chosen.
  #
  # `testWorkerCount()` defaults to `cores - 1`, capped at 8. On an eight-core
  # machine that is seven workers, each with its own Prisma pool of
  # `cores * 2 + 1` connections plus pg-boss's own — and at that level this
  # suite does not merely go slow, it takes PostgreSQL down: a backend exits
  # with code 2 and the whole cluster enters recovery, failing every test that
  # was in flight and reading as eighty unrelated bugs.
  #
  # Measured over fourteen full runs on an eight-core box, LXC and KVM alike:
  #
  #   7 workers, default max_connections  — 1 crash in 5 runs
  #   7 workers, max_connections=300      — 1 in 2 (LXC), 3 in 3 (KVM)
  #   4 workers, default max_connections  — 0 crashes, 0 hook timeouts, 3 runs
  #
  # Raising `max_connections` made it worse, not better: at the default the
  # excess connections are refused cleanly and concurrency is capped, while at
  # 300 they are all established and the machine is oversubscribed. The lever
  # is the demand, and this is it.
  #
  # THE FOUR ABOVE WAS WRONG FOR THIS RUNNER, on the second premise, not the
  # first: this is a PRIVATE repository, and GitHub gives those standard
  # Linux runners two vCPUs, not four -- `testWorkerCount()`'s own default
  # would pick ONE here (`cores - 1`), leaving a core free for Postgres and
  # this process exactly as its comment says. Pinning to four forced FOUR
  # workers onto TWO cores, and the suite's own test data survived that fine
  # -- it was vitest's own worker<->main RPC heartbeat that did not: a
  # hardcoded 60s timeout in the `birpc` layer vitest uses internally
  # (unrelated to `testTimeout`/`hookTimeout` above, and not configurable —
  # see vitest-dev/vitest#6479, #4497, #8164), tripped by workers too
  # CPU-starved to answer a status ping in time. First seen cutting v1.0.1,
  # the first tag ever built for real: "Test Files 181 passed (181)", "Tests
  # 3644 passed (3644)", and the job still failed on an unrelated RPC
  # timeout, identically on two consecutive attempts. Two workers halves the
  # oversubscription without reintroducing the Postgres-crash risk `SYNTRA_
  # TEST_WORKERS` was pinned to guard against in the first place.
  #
  # THE RPC HALF OF THAT STORY IS OVER: Vitest 5 does not produce the
  # heartbeat timeout, and `vitest.config.ts` no longer suppresses unhandled
  # errors to hide it. The number below stays at two anyway, because the
  # FIRST premise still holds -- this runner has two vCPUs and one Postgres
  # sharing them, and that is what the four-versus-seven measurements above
  # were about. Left where it was measured rather than raised on the strength
  # of an upstream fix to a different problem.
  SYNTRA_TEST_WORKERS: 2

  # A hosted runner is slower than the machine this budget was calibrated on,
  # and the BOUNDED halves of the transaction-budget pairs report the runner's
  # speed rather than the code's. Measured here: 2,505, 2,561, 2,633 and 2,959 ms
  # for slice 1, and 3,560 ms for slice 2 — which is why 3,500 was not enough.
  # It was calibrated from slice 1's numbers alone, and slice 2's bounded case
  # is the heavier of the two.
  #
  # 4,500 still leaves 500 ms under Prisma's 5,000 ms interactive-transaction
  # ceiling, and the defect this pair exists to catch does not merely exceed
  # the budget — it ABORTS at that ceiling. So any figure below 5,000 catches
  # it, and the check keeps its teeth.
  #
  # Slice 1's mutation half polices this value — it compares a measurement
  # against the budget, so a figure raised past Prisma's ceiling makes that test
  # red. Slice 2's does not: it accepts an abort at the ceiling, which is
  # budget-independent. Measured, not assumed.
  GOVERN_BUDGET_MS: 4500

jobs:
  # ---------------------------------------------------------------------------
  # Everything the suite below used to do BEFORE and AFTER `pnpm test`, in a
  # job of its own: the shell tools, the typecheck, the lint, the console's
  # tests and its production bundle.
  #
  # Split out when the suite was sharded, rather than left on shard 1. None of
  # it touches a database -- the typecheck and the lint need the generated
  # Prisma client, not a server to point it at -- so it does not need the
  # containers, and on its own runner it finishes well inside a shard's time
  # instead of making shard 1 the long pole. Run once, not four times: four
  # copies of a typecheck is four chances for the same red line and no extra
  # coverage.
  # ---------------------------------------------------------------------------
  checks:
    name: typecheck, lint and console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: The operational shell tools' own logic
        # bash -n first: a syntax error in the updater is discovered at 2am
        # by a system that has already migrated its database, and the fast
        # syntax check catches it in under a second rather than after Node
        # and Postgres have spun up for nothing.
        #
        # The harnesses source the SHIPPED scripts (SYNTRA_UPDATE_SOURCE_ONLY=1
        # and the same guard in syntra-backup) rather than a copy, so this is
        # the only automated coverage of the guards release.yml now depends on
        # being correct: version_valid (a path-traversal refusal),
        # adoption_allowed (keeps --adopt off real releases),
        # previous_release_of (where a rollback goes), and the env/URL parsers
        # the migrate step and the dump/restore need.
        #
        # syntra-backup is checked here for the same reason and was not,
        # which was the worse omission of the two: it is the disaster-recovery
        # tool, releases gate on this workflow, and a `create`/`verify`/
        # `restore` nothing exercises is a tool whose first real run is the
        # one taken during an incident.
        run: |
          bash -n ops/syntra-update ops/syntra-install ops/syntra-backup
          bash ops/syntra-update.test.sh
          bash ops/syntra-backup.test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `packageManager` in package.json pins the version. A newer pnpm installs
      # without running build scripts for Prisma and argon2, reports success,
      # and leaves nothing able to reach the database.
      - run: corepack enable

      - name: Get the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Write the environment
        # Placeholders only, as in the openapi job below: nothing here
        # connects to anything, and these exist so nothing imported on the
        # way trips over an unset variable.
        run: |
          cp .env.example .env
          cp packages/db/.env.example packages/db/.env

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Typecheck
        run: pnpm exec tsc -b --force

      # AFTER the typecheck, which is where its value is. It runs in about a
      # minute and catches the things `tsc` cannot see -- a promise nobody
      # awaited, a hook behind a condition.
      #
      # It needs the generated Prisma client, which is why it cannot move
      # above `pnpm db:generate`: the type-aware rules ask the compiler about
      # every `tx.` call, and without the client those are `any`.
      - name: Lint
        run: pnpm lint

      # THE CONSOLE'S TESTS, which ran in no job at all until this step.
      #
      # The root vitest config matches `*.test.ts` only, so every
      # `apps/web/**/*.test.tsx` file -- 37 of them, 303 tests -- was
      # invisible to `pnpm test`. Because release.yml reuses this workflow
      # through `workflow_call`, tagged releases shipped with them unexecuted
      # too. A stale assertion in StatusToggle.test.tsx sat red on main until
      # a full local run turned it up.
      #
      # A separate step rather than folded into `pnpm test`: these need jsdom
      # and the React plugin, which is what apps/web/vitest.config.ts is.
      - name: Test the console
        run: pnpm --filter @syntra/web test

      # THE PRODUCTION BUNDLE, which nothing built until this step.
      #
      # The browser job exercises the Vite DEV server, so a break that only
      # appears in a production build -- a rollup resolution failure, a
      # tailwind config error, a dynamic import path -- merged green and first
      # surfaced in release.yml, or on the lab host halfway through a deploy.
      # It takes a couple of seconds.
      - name: Build the console
        run: pnpm --filter @syntra/web build

  # ---------------------------------------------------------------------------
  # The unit and integration suite: 338 files, ~5,800 tests, against a real
  # PostgreSQL, a real OpenLDAP and a real Samba domain controller.
  #
  # `docker compose` rather than GitHub's `services:`, deliberately. The
  # OpenLDAP container needs its bootstrap LDIF and its TLS settings, and the
  # Samba container needs a domain provisioned; both are already expressed in
  # `infra/docker-compose.yml`, and a second, drifting copy of that in YAML is
  # how CI starts testing something the developers do not run.
  #
  # FOUR SHARDS, because one job spent 29 of its ~34 minutes in `pnpm test`.
  # Vitest's `--shard` splits by FILE, so every shard is a whole `vitest run`
  # of its own on its own runner: its own containers, its own global setup
  # provisioning and migrating its own scratch databases, and its own
  # `SYNTRA_TEST_WORKERS: 2` -- the measurements above are per runner, and a
  # shard is one runner, so they hold unchanged. Nothing is shared between
  # shards that could make one wait on, or truncate under, another.
  #
  # Checked before splitting: no file in the suite reads state another file
  # left behind. The ones that look across the codebase -- the migration
  # order, the Prisma boundary, the OpenAPI coverage, the tenant-isolation
  # probe over every route -- read the source tree or build the route table
  # themselves, so they hold in whichever shard they land in, and no custom
  # sequencer is needed to keep any of them together.
  #
  # `pnpm test` with no argument is still the whole suite, unsharded; the
  # shard is passed here and only here.
  # ---------------------------------------------------------------------------
  test-shard:
    name: tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # About a quarter of the 29 minutes, plus the containers and the install
    # every shard now pays for itself. Twice that, not the old 60: a shard
    # that runs for an hour is hung, not slow.
    timeout-minutes: 30
    strategy:
      # One red shard must not cancel the other three: a failure that only
      # shows up as "cancelled" in three places hides whatever else was red.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same reason as in `checks`: the pinned pnpm, or Prisma's build scripts
      # do not run and nothing can reach the database.
      - run: corepack enable

      - name: Get the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Start PostgreSQL, OpenLDAP, Samba and MailDev
        run: docker compose -f infra/docker-compose.yml up -d

      # The Vault dev server behind the `kms` profile, which the plain `up -d`
      # above does not start. Seconds to boot, in-memory, and the only way the
      # Transit master-key provider's integration test runs anywhere but a
      # developer's machine. VAULT_TRANSIT_INTEGRATION on the Test step turns
      # that test's skip-when-unreachable into a failure, so a container that
      # did not come up cannot pass as a suite that skipped. Started in every
      # shard, not just the one that happens to hold that file today: which
      # shard a file lands in is Vitest's decision and moves as files are added.
      - name: Start the Vault dev server
        run: docker compose -f infra/docker-compose.yml --profile kms up -d vault

      - name: Write the environment
        # Two files, because Prisma's CLI reads `.env` from its own working
        # directory and pnpm runs `migrate` with the cwd set to packages/db.
        run: |
          cp .env.example .env
          cp packages/db/.env.example packages/db/.env
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "MASTER_KEY=$(openssl rand -base64 32)"
          } >> .env

      - run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec infra-postgres-1 pg_isready -U syntra -d syntra && exit 0
            sleep 2
          done
          echo "PostgreSQL never became ready"; docker compose -f infra/docker-compose.yml logs postgres; exit 1

      - run: pnpm db:generate
      - run: pnpm db:migrate

      # TWO FAILURE MODES WORTH TELLING APART before you suspect your change.
      #
      # `Hook timed out in 30000ms` on a `resetDatabase()` hook: seven workers
      # truncating every table between every test, contending on one server.
      # The failing set moves between runs and each file passes alone. Not seen
      # at all in three runs at four workers, which is why `SYNTRA_TEST_WORKERS`
      # is pinned above.
      #
      # Eighty-odd files failing at once, with `the database system is in
      # recovery mode` in the output: PostgreSQL crashed. Nothing failed on its
      # merits and there is no point reading the list. Same cause, same fix.
      # (Per shard now: a crash reads as a quarter of eighty, in one shard.)
      #
      # Neither is retried. A retry would hide the second one, and the second
      # one is the important one.
      # See docs/superpowers/specs/2026-08-15-directory-sync-known-gaps.md.
      - name: Wait for Vault
        run: pnpm vault:wait

      # `pnpm test -- --shard=…` reaches Vitest as `vitest run --shard=…`:
      # pnpm 9 drops the `--` and passes the rest through.
      - name: Test
        run: pnpm test -- --shard=${{ matrix.shard }}/4
        env:
          VAULT_TRANSIT_INTEGRATION: '1'

      - name: Container logs, if the suite failed
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 100

  # ---------------------------------------------------------------------------
  # ONE "tests" status, as there was before the split, for branch protection
  # and for anybody reading the checks list: green only when every shard AND
  # the checks job above are green.
  #
  # `always()`, because without it a failed shard SKIPS this job, and a
  # skipped required check is one GitHub may treat as satisfied. So it always
  # runs and decides for itself, and anything other than `success` -- failure,
  # cancelled, skipped -- is red.
  # ---------------------------------------------------------------------------
  test:
    name: tests
    needs: [checks, test-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard and the checks passed
        env:
          CHECKS: ${{ needs.checks.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "checks: $CHECKS"
          echo "shards: $SHARDS"
          if [ "$CHECKS" != "success" ] || [ "$SHARDS" != "success" ]; then
            echo "::error::A shard or the checks job did not succeed; see the jobs above."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The browser suite, against a running stack. Separate job because it needs
  # the application up, seeded, and a browser — and because a failure here means
  # something different from a failure above.
  # ---------------------------------------------------------------------------
  e2e:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Get the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Start PostgreSQL, OpenLDAP, Samba and MailDev
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Write the environment
        run: |
          cp .env.example .env
          cp packages/db/.env.example packages/db/.env
          {
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "MASTER_KEY=$(openssl rand -base64 32)"
          } >> .env

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright's Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec infra-postgres-1 pg_isready -U syntra -d syntra && exit 0
            sleep 2
          done
          echo "PostgreSQL never became ready"; exit 1

      - run: pnpm db:generate
      - run: pnpm db:migrate

      # A fresh seed, every time. The integration suite truncates between cases
      # and leaves the last one's fixtures behind, which is enough to fool the
      # seed's idempotence guard into doing nothing — and the browser tests then
      # look at a directory with no people in it.
      #
      # `SYNTRA_ALLOW_RESET` names the database deliberately: `db:reset`
      # refuses anything that is not a scratch `syntra_test_*` database unless
      # told which one it is emptying. The development and lab databases are
      # both called `syntra`, so the name cannot tell them apart, and the
      # NODE_ENV guard this replaced protected neither. CI names its own for
      # the same reason anybody else has to.
      # See packages/db/src/reset-guard.ts.
      - name: Seed
        run: |
          SYNTRA_ALLOW_RESET=syntra pnpm db:reset
          pnpm seed

      - name: Start the application
        # The rate limit is doing its job when it refuses: this suite signs in
        # far more often in a minute than a person ever would.
        #
        # `OUTBOUND_ALLOW_PRIVATE` for the person-source browser test. The
        # SFTP fixture is a container on loopback, and the outbound guard
        # refuses private addresses by default — correctly, since that default
        # is what stops an administrator pointing a source at a metadata
        # service. It is lifted here rather than in `.env.example`, which is
        # what a real deployment copies.
        run: |
          AUTH_RATE_LIMIT_MAX=200 OUTBOUND_ALLOW_PRIVATE=true pnpm dev > /tmp/dev.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null -H 'Host: acme.localhost' http://127.0.0.1:5173/login \
               && curl -s -o /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 2
          done
          echo "the stack never came up"; cat /tmp/dev.log; exit 1

      - run: pnpm e2e

      - name: What the application said, if the browser suite failed
        if: failure()
        run: tail -100 /tmp/dev.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Proves both Dockerfiles still build. Nothing above builds a container
  # image, so a broken Dockerfile -- a stale COPY, a package moved between
  # workspaces -- merged green here and only surfaced in release.yml's image
  # job, on a tag, after the tarball had already been cut. No push: this job
  # exists to catch a build failure cheaply, not to publish anything.
  # ---------------------------------------------------------------------------
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=syntra-api
          cache-to: type=gha,mode=max,scope=syntra-api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=syntra-web
          cache-to: type=gha,mode=max,scope=syntra-web

  # ---------------------------------------------------------------------------
  # The Helm chart. Nothing else here renders it, so a template error -- a
  # bad indent, a value renamed in values.yaml but not in a template -- would
  # otherwise surface as `helm install` failing on somebody's cluster, which
  # is the most expensive place to find out.
  #
  # Rendered twice, from deploy/helm/syntra/ci/: the least an install can set,
  # and every optional feature switched on. Both must lint under --strict,
  # render, and validate against the Kubernetes schemas (and the Prometheus
  # Operator CRDs, for the ServiceMonitor and PrometheusRule).
  # ---------------------------------------------------------------------------
  helm:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`: a Helm minor that tightens template parsing
      # should arrive as a deliberate bump, not as a red build on an
      # unrelated pull request.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint
        run: |
          helm lint --strict deploy/helm/syntra -f deploy/helm/syntra/ci/minimal-values.yaml
          helm lint --strict deploy/helm/syntra -f deploy/helm/syntra/ci/full-values.yaml

      - name: Render
        run: |
          mkdir -p "$RUNNER_TEMP/helm"
          helm template syntra deploy/helm/syntra -n syntra \
            -f deploy/helm/syntra/ci/minimal-values.yaml > "$RUNNER_TEMP/helm/minimal.yaml"
          helm template syntra deploy/helm/syntra -n syntra \
            -f deploy/helm/syntra/ci/full-values.yaml > "$RUNNER_TEMP/helm/full.yaml"

      - name: Refuses to render without a Secret
        # The chart's one hard safety rule: it never guesses a Secret name
        # and never renders credentials unless told to. A default that
        # rendered anyway would install "successfully" and then sit in
        # CreateContainerConfigError -- or worse, pick up a Secret of the
        # same name that belongs to something else.
        run: |
          if helm template syntra deploy/helm/syntra --set publicUrl=https://idm.example.com \
               > /dev/null 2> "$RUNNER_TEMP/helm/refusal.txt"; then
            echo "The chart rendered with no existingSecret; it must refuse." >&2
            exit 1
          fi
          grep -q 'Set existingSecret' "$RUNNER_TEMP/helm/refusal.txt"

      - name: Validate against the Kubernetes schemas
        run: |
          docker run --rm -v "$RUNNER_TEMP/helm:/work" ghcr.io/yannh/kubeconform:v0.6.7-alpine \
            -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /work/minimal.yaml /work/full.yaml

      - name: The backup CronJob's script parses
        # It is shell inside YAML inside a template, which is three chances
        # for an indentation slip to produce a script `sh` rejects -- at 2am,
        # on the first scheduled run.
        run: |
          yq 'select(.kind == "ConfigMap" and .metadata.name == "syntra-backup") | .data["backup.sh"]' \
            "$RUNNER_TEMP/helm/full.yaml" > "$RUNNER_TEMP/helm/backup.sh"
          test -s "$RUNNER_TEMP/helm/backup.sh"
          sh -n "$RUNNER_TEMP/helm/backup.sh"

      - name: The PrometheusRule matches ops/prometheus-alerts.yml
        # Helm cannot read outside the chart directory, so the chart carries
        # a copy. Two copies of an alert definition drift; this makes the
        # drift a failed build rather than an alert that fires in one
        # deployment shape and not the other.
        run: diff -u ops/prometheus-alerts.yml deploy/helm/syntra/files/prometheus-alerts.yml

  # ---------------------------------------------------------------------------
  # The published OpenAPI description (docs/api/openapi.json) matches the code.
  #
  # The document is GENERATED -- from the route table the API registers and
  # the `*.openapi.ts` descriptions beside each route module -- and COMMITTED,
  # so that a reviewer sees every change to the public contract as a diff in
  # the pull request that makes it, and an integrator can read it without
  # running anything. A committed generated file is only worth that if it
  # cannot go stale, and this job is what stops it: regenerate, and fail on
  # any difference -- including a document nobody committed at all.
  #
  # Whether every admin route HAS a description is a different question, and
  # it is asked by `apps/api/src/openapi/openapi.test.ts` in the suite above.
  # This job asks only whether the committed copy is the current one.
  #
  # Its own job, and deliberately cheap: no PostgreSQL, no directory
  # containers. The generator builds the application and asks it for the
  # document through `inject`, and nothing on that path touches a database,
  # so a contract change gets its answer in a minute rather than after the
  # full suite. `db:generate` is still needed, because the API imports the
  # Prisma client even when it never connects.
  #
  # The fix, when this fails, is printed below: run the generator and commit.
  # ---------------------------------------------------------------------------
  openapi:
    name: openapi document
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same reason as in `checks`: the pinned pnpm, or Prisma's build scripts
      # do not run and the client the API imports does not exist.
      - run: corepack enable

      - name: Get the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Write the environment
        # Placeholders only. The generator hands `loadConfig` a configuration
        # of its own; these exist so nothing imported on the way trips over an
        # unset variable and fails for a reason unrelated to the document.
        run: |
          cp .env.example .env
          cp packages/db/.env.example packages/db/.env

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Generate the document
        run: pnpm openapi:generate

      - name: The committed document is the generated one
        # `git diff --exit-code` for a changed document, and `git status
        # --porcelain` for one that was never added: an untracked file has no
        # diff, and would otherwise pass.
        run: |
          if ! git diff --exit-code -- docs/api/openapi.json \
             || [ -n "$(git status --porcelain -- docs/api/openapi.json)" ]; then
            echo "::error file=docs/api/openapi.json::docs/api/openapi.json is out of date. Run 'pnpm openapi:generate' and commit the result."
            exit 1
          fi
