services:
  postgres:
    image: postgres:16
    # `synchronous_commit=off`: a commit no longer waits for WAL to reach disk.
    # For a throwaway database that is free speed, and it takes fsync latency
    # out of the truncate storm this suite generates. Deliberately NOT
    # `fsync=off` or `full_page_writes=off`, which trade crash CORRUPTION for
    # speed.
    #
    # `max_connections` IS LEFT AT THE DEFAULT 100, and that is a correction of
    # an earlier change here rather than an oversight. Prisma's pool is
    # `cores * 2 + 1` per client and every vitest worker builds its own — 231
    # across seven workers on an eight-core box. Raising the ceiling to 300 to
    # "fix" that made things dramatically worse: at 100 the excess connections
    # are refused cleanly and concurrency is capped, while at 300 all 231
    # backends actually get established and oversubscribe the machine.
    # Measured, over eleven full suite runs: 1 crash in 5 at the default,
    # 1 in 2 at 300 under LXC, and 3 in 3 at 300 under KVM.
    #
    # The ceiling was never the problem. The demand is, and the lever for that
    # is `SYNTRA_TEST_WORKERS`, not this file.
    command:
      - postgres
      - -c
      - synchronous_commit=off
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: syntra
      POSTGRES_DB: syntra
    ports: ['5432:5432']
    volumes:
      # Creates the non-superuser role the application connects as. Runs once,
      # on an empty data directory.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syntra']
      interval: 2s
      timeout: 3s
      retries: 20

  maildev:
    image: maildev/maildev:2.1.0
    ports: ['1080:1080', '1025:1025']

  openldap:
    image: osixia/openldap:1.5.0
    command: ['--copy-service']
    environment:
      LDAP_ORGANISATION: Acme Care
      LDAP_DOMAIN: acme.test
      LDAP_ADMIN_PASSWORD: adminpassword
      # The image generates a self-signed certificate and serves both LDAPS
      # (636) and StartTLS (389) with it. Its default `demand` would also
      # require a client certificate, which drops the socket mid-handshake
      # for any client that has none -- so StartTLS could not be exercised at
      # all. `try` keeps the server's certificate mandatory and the client's
      # optional, which is what an ordinary LDAP deployment does.
      LDAP_TLS_VERIFY_CLIENT: try
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    # 636 is mapped so the LDAPS path is testable too. The certificate is
    # self-signed, so a test that connects to either port has to say
    # `rejectUnauthorized: false` deliberately -- which is the point: with
    # verification left at its default, both refuse to connect.
    ports: ['1389:389', '1636:636']

  samba:
    # Pinned to a dated, immutable tag, verified by `docker pull` before it was
    # written here (spike, Ruling P3). NOT `:latest`. Five plausible-sounding
    # alternatives -- elswork/samba-dc, svenpetersen1965/samba-ad-dc,
    # phillamon/samba-dc, domainc/samba-ad-dc, athenian/samba-dc -- do not
    # exist in the registry at all. Do not swap this without pulling first.
    image: nowsci/samba-domain:20260801025201
    # REQUIRED, not optional. Without it the container gets through most of
    # domain provisioning and then dies:
    #   set_nt_acl_no_snum: fset_nt_acl returned NT_STATUS_ACCESS_DENIED.
    #   ERROR(runtime): uncaught exception - (3221225506, '{Access Denied} ...')
    #     ... setsysvolacl ... setntacl ... smbd.set_nt_acl
    #   exit=255
    # Samba's provisioning sets NT ACLs on the sysvol filesystem, which needs
    # privileges the container does not have without this. It is a real
    # constraint on whatever runs the suite: a Docker host that permits
    # privileged containers. True for a self-hosted runner and for GitHub
    # Actions' standard Linux runners; NOT guaranteed on more locked-down or
    # sandboxed CI. See infra/samba/README.md.
    privileged: true
    environment:
      DOMAIN: SYNTRA.TEST
      DOMAINPASS: 'Syntra!Passw0rd'
      HOSTIP: 127.0.0.1
      INSECURELDAP: 'false'
    # Only 389 and 636 are needed for everything Provision does. The image
    # documents a much larger port surface (53, 88, 123, 135, 137-139, 445,
    # 464, 1024-1044, 3268-3269) for domain join; Kerberos and SMB are not
    # required for anything that goes over ldapts, so the suite stays narrow.
    # 1390 is mapped for diagnostics only -- see the README: this server
    # refuses even a plain simple bind, so nothing in the suite uses it.
    #
    # NOT 1389: `openldap` above already publishes 389 there, and Docker
    # refuses the second claim outright --
    #   Bind for 0.0.0.0:1389 failed: port is already allocated
    # -- so `docker compose up` could never bring both up at once. Observed,
    # not theorised.
    ports: ['1390:389', '1637:636']
