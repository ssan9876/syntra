{{- if .Values.backup.enabled }}
{{- $secret := include "syntra.secretName" . -}}
{{- $fullname := include "syntra.fullname" . -}}
{{- $claim := default (printf "%s-backups" $fullname) .Values.backup.persistence.existingClaim -}}
{{- if not .Values.backup.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
  annotations:
    # Backups outlive the release: `helm uninstall` must not take the history
    # with it.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
{{- end }}
# The backup agent (apps/api/src/backup-agent): restore points on a schedule,
# and Back up now, download, upload and restore from Administration ->
# Backups. It holds the role that bypasses row-level security and the backup
# volume; the API reaches it through the Service below with a token derived
# from SESSION_SECRET. One replica, replaced rather than rolled: two agents on
# one volume would prune each other's backups.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "backup") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "syntra.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # A restore in progress is not something to cut short.
      terminationGracePeriodSeconds: 300
      securityContext:
        {{- toYaml .Values.podSecurityContext.api | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backup
          image: {{ include "syntra.image" (dict "image" .Values.api.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          workingDir: /app/apps/api
          command: ["node", "--import", "tsx", "src/backup-agent/main.ts"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: agent
              containerPort: 3100
              protocol: TCP
          env:
            - { name: NODE_ENV, value: production }
            - { name: HOME, value: /tmp }
            - { name: BACKUP_DIR, value: /backups }
            - { name: BACKUP_INTERVAL_HOURS, value: {{ .Values.backup.intervalHours | quote }} }
            - { name: BACKUP_KEEP_HOURLY, value: {{ .Values.backup.retention.hourly | quote }} }
            - { name: BACKUP_KEEP_DAILY, value: {{ .Values.backup.retention.daily | quote }} }
            - { name: BACKUP_KEEP_WEEKLY, value: {{ .Values.backup.retention.weekly | quote }} }
            - { name: BACKUP_KEEP_MANUAL, value: {{ .Values.backup.retention.manual | quote }} }
            {{- with .Values.backup.copyCommand }}
            - { name: BACKUP_COPY_COMMAND, value: {{ . | quote }} }
            {{- end }}
            - { name: BACKUP_VERIFY_EVERY_DAYS, value: {{ .Values.backup.verifyEveryDays | quote }} }
            {{- with .Values.backup.offsite }}
            {{- if .bucket }}
            - { name: BACKUP_S3_BUCKET, value: {{ .bucket | quote }} }
            {{- with .region }}
            - { name: BACKUP_S3_REGION, value: {{ . | quote }} }
            {{- end }}
            {{- with .endpoint }}
            - { name: BACKUP_S3_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            {{- with .prefix }}
            - { name: BACKUP_S3_PREFIX, value: {{ . | quote }} }
            {{- end }}
            {{- with .forcePathStyle }}
            - { name: BACKUP_S3_FORCE_PATH_STYLE, value: {{ . | quote }} }
            {{- end }}
            {{- include "syntra.secretEnv" (dict "name" "BACKUP_S3_PASSPHRASE" "secret" $secret "key" .passphraseKey) | nindent 12 }}
            {{- include "syntra.secretEnv" (dict "name" "BACKUP_S3_ACCESS_KEY_ID" "secret" $secret "key" .accessKeyIdKey "optional" true) | nindent 12 }}
            {{- include "syntra.secretEnv" (dict "name" "BACKUP_S3_SECRET_ACCESS_KEY" "secret" $secret "key" .secretAccessKeyKey "optional" true) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- include "syntra.secretEnv" (dict "name" "SUPERUSER_DATABASE_URL" "secret" $secret "key" .Values.backup.databaseUrlKey) | nindent 12 }}
            {{- include "syntra.secretEnv" (dict "name" "DATABASE_URL" "secret" $secret "key" .Values.secretKeys.databaseUrl) | nindent 12 }}
            {{- include "syntra.secretEnv" (dict "name" "SESSION_SECRET" "secret" $secret "key" .Values.secretKeys.sessionSecret) | nindent 12 }}
            # Only fingerprinted (salted SHA-256) into each manifest, never
            # written out.
            {{- include "syntra.secretEnv" (dict "name" "MASTER_KEY" "secret" $secret "key" .Values.secretKeys.masterKey "optional" true) | nindent 12 }}
            {{- with .Values.api.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The API's own extra sources, where MASTER_KEY_PROVIDER and the
          # Vault or KMS key reference live on a deployment that keeps the
          # master key out of the cluster.
          {{- with .Values.api.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: { port: agent }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: agent }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backup.resources | nindent 12 }}
          volumeMounts:
            - { name: backups, mountPath: /backups }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ $claim }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "backup") | nindent 4 }}
  ports:
    - { name: agent, port: 3100, targetPort: agent, protocol: TCP }
{{- end }}
