{{- if .Values.backup.enabled }}
{{- $secret := include "syntra.secretName" . -}}
{{- $fullname := include "syntra.fullname" . -}}
{{- $claim := default (printf "%s-backups" $fullname) .Values.backup.persistence.existingClaim -}}
{{- if not .Values.backup.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
  annotations:
    # Backups outlive the release: `helm uninstall` must not take the history
    # with it.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .Values.backup.persistence.accessModes | nindent 4 }}
  {{- with .Values.backup.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
data:
  # The Kubernetes counterpart of `ops/syntra-backup create`: same directory
  # layout (syntra-<UTC stamp>/{database.dump,manifest.json}), same checks,
  # same fingerprint salt -- so a backup taken here reads the same way to a
  # person comparing it with one taken on a host.
  backup.sh: |
    #!/bin/sh
    set -eu
    umask 077
    BACKUPS=/backups
    KEEP="${SYNTRA_BACKUP_KEEP:-7}"
    SALT='syntra-backup-fingerprint-v1'
    log() { printf '%s  %s\n' "$(date -u +%H:%M:%S)" "$*"; }
    die() { printf 'syntra-backup: %s\n' "$*" >&2; exit 1; }

    name="syntra-$(date -u +%Y%m%dT%H%M%SZ)"
    PARTIAL="$BACKUPS/$name.partial"
    [ -e "$PARTIAL" ] && die "$PARTIAL already exists; is another backup running?"
    mkdir -p "$PARTIAL"
    # A diagnosed failure leaves a message, not litter. A killed pod leaves the
    # .partial directory, which is never mistaken for a backup.
    trap 'if [ -n "$PARTIAL" ]; then rm -rf "$PARTIAL"; fi' EXIT

    db=$(psql -d "$SYNTRA_BACKUP_DATABASE_URL" -tAc 'SELECT current_database()') \
      || die "cannot connect with the backup database URL"
    log "dumping $db"
    pg_dump -d "$SYNTRA_BACKUP_DATABASE_URL" -Fc -f "$PARTIAL/database.dump" \
      || die "pg_dump failed -- can this role read every table?"

    # Exists, is a custom-format archive, and CONTAINS ROWS. The last is the
    # one that matters: every tenant table is FORCE ROW LEVEL SECURITY, so a
    # dump taken as the application role is a perfect archive of nothing.
    [ -s "$PARTIAL/database.dump" ] || die "the dump is empty"
    head -c 5 "$PARTIAL/database.dump" | grep -q PGDMP || die "the dump is not a PostgreSQL archive"
    sections=$(pg_restore -l "$PARTIAL/database.dump" | grep -c 'TABLE DATA' || true)
    [ "${sections:-0}" -gt 0 ] \
      || die "the dump contains no table data -- was it taken as a role that bypasses row-level security?"
    bytes=$(wc -c < "$PARTIAL/database.dump" | tr -d ' ')

    if [ -n "${MASTER_KEY:-}" ]; then
      fp="\"$(printf '%s%s' "$SALT" "$MASTER_KEY" | sha256sum | cut -d' ' -f1 | sed 's/^/sha256:/')\""
    else
      fp=null
    fi
    cat > "$PARTIAL/manifest.json" <<JSON
    {
      "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "version": "${SYNTRA_VERSION:-unknown}",
      "database": "$db",
      "tableDataSections": $sections,
      "bytes": $bytes,
      "masterKeyFingerprint": $fp
    }
    JSON

    # Nothing is a backup until this rename.
    mv "$PARTIAL" "$BACKUPS/$name"
    PARTIAL=''
    log "wrote $name -- $bytes bytes, $sections table(s) of data"

    ls -1 "$BACKUPS" | grep '^syntra-' | grep -v '\.partial$' | sort -r \
      | tail -n +$((KEEP + 1)) | while read -r old; do
        [ -n "$old" ] || continue
        rm -rf "${BACKUPS:?}/$old"
        log "pruned $old"
      done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $fullname }}-backup
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            {{- include "syntra.labels" (dict "ctx" $ "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "syntra.serviceAccountName" . }}
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            # `postgres` in the alpine image; fsGroup makes the volume writable.
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              command: ["/bin/sh", "/scripts/backup.sh"]
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                - { name: HOME, value: /tmp }
                - { name: SYNTRA_BACKUP_KEEP, value: {{ .Values.backup.keep | quote }} }
                - { name: SYNTRA_VERSION, value: {{ default .Chart.AppVersion .Values.api.image.tag | quote }} }
                {{- include "syntra.secretEnv" (dict "name" "SYNTRA_BACKUP_DATABASE_URL" "secret" $secret "key" .Values.backup.databaseUrlKey) | nindent 16 }}
                # Only fingerprinted (salted SHA-256), never written out.
                {{- include "syntra.secretEnv" (dict "name" "MASTER_KEY" "secret" $secret "key" .Values.secretKeys.masterKey "optional" true) | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ $claim }}
            - name: scripts
              configMap:
                name: {{ $fullname }}-backup
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
{{- end }}
