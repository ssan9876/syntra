{{- if and .Values.secret.create (not .Values.existingSecret) }}
# Disposable environments only -- see values.yaml. A hook, so it exists before
# the pre-install migration Job reads it; Helm therefore does not delete it on
# uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syntra.secretName" . }}
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "runtime") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
