apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: syntra, app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: syntra, app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ .Values.web.image | quote }}
          ports: [{ name: http, containerPort: 80 }]
          resources:
{{ toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-web }
spec:
  selector: { app.kubernetes.io/name: syntra, app.kubernetes.io/component: web, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.web.servicePort }}, targetPort: http }]
