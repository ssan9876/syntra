{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "syntra.serviceAccountName" . }}
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload calls the Kubernetes API. Pods also set this themselves;
# stating it here covers anything else that ends up using this account.
automountServiceAccountToken: false
{{- end }}
