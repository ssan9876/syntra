{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
# Web: reachable only from the ingress controller; may talk only to the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syntra.fullname" . }}-web
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressFrom.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.ingressFrom.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    {{- include "syntra.np.dns" $np.dns | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "api") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3000 }
---
# API: reachable only from the web pods (and the metrics scraper, when the
# ServiceMonitor is on). Egress by port: DNS, Postgres, SMTP, and the
# connector allow-list. Kubelet probes originate on the node and are not
# governed by NetworkPolicy on mainstream CNIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syntra.fullname" . }}-api
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "web") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 3000 }
    {{- if .Values.metrics.serviceMonitor.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml $np.metricsFrom.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $np.metricsFrom.podSelector | nindent 12 }}
      ports:
        - { protocol: TCP, port: 3000 }
    {{- end }}
  egress:
    {{- include "syntra.np.dns" $np.dns | nindent 4 }}
    {{- include "syntra.np.cidrRule" (dict "rule" $np.postgres "except" $np.metadataExcept) | nindent 4 }}
    {{- include "syntra.np.cidrRule" (dict "rule" $np.smtp "except" $np.metadataExcept) | nindent 4 }}
    {{- range $np.connectorEgress }}
    {{- include "syntra.np.cidrRule" (dict "rule" . "except" $np.metadataExcept) | nindent 4 }}
    {{- end }}
    {{- with $np.extraApiEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
# Migration and backup Jobs: no inbound traffic; outbound only to DNS and
# Postgres. (On a first install the migration hook runs before this policy
# exists and is unrestricted; from the first upgrade on, it applies.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syntra.fullname" . }}-jobs
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "jobs") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: syntra
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [migrate, backup] }
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "syntra.np.dns" $np.dns | nindent 4 }}
    {{- include "syntra.np.cidrRule" (dict "rule" $np.postgres "except" $np.metadataExcept) | nindent 4 }}
{{- if .Values.apiRolloutRestart.enabled }}
---
# The restart Job reaches only the Kubernetes API server. Its address is
# cluster-specific, so this allows the usual API ports anywhere but the
# metadata service; narrow it to your control plane's addresses if known.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "syntra.fullname" . }}-rollout-restart
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "rollout-restart") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "syntra.selectorLabels" (dict "ctx" $ "component" "rollout-restart") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "syntra.np.dns" $np.dns | nindent 4 }}
    {{- include "syntra.np.cidrRule" (dict "rule" (dict "cidrs" (list "0.0.0.0/0") "ports" (list 443 6443)) "except" $np.metadataExcept) | nindent 4 }}
{{- end }}
{{- end }}
