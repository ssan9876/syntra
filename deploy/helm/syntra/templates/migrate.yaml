{{- if .Values.migration.enabled }}
{{- $secret := include "syntra.secretName" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "syntra.fullname" . }}-migrate
  labels:
    {{- include "syntra.labels" (dict "ctx" $ "component" "migrate") | nindent 4 }}
  annotations:
    # Before the Deployments change, on install and on every upgrade, so a new
    # image never starts against an older schema. A failed migration fails the
    # `helm upgrade` and leaves the running release untouched.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # Kept on failure (only replaced by the next attempt) so its logs can be
    # read; removed on success.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # One retry, not the default six: `prisma migrate deploy` is idempotent,
  # but a migration that failed twice needs a person, not a loop.
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "syntra.labels" (dict "ctx" $ "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # The `default` ServiceAccount, not the chart's: a pre-install hook runs
      # before the chart's own ServiceAccount exists. No token either way.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext.api | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "syntra.image" (dict "image" .Values.api.image "ctx" $) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # The Prisma CLI directly rather than through pnpm, which (via
          # corepack) wants a writable home the read-only root does not give
          # it. Same command as `pnpm --filter @syntra/db migrate`.
          workingDir: /app/packages/db
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: HOME, value: /tmp }
            # No update check or telemetry call from inside the cluster.
            - { name: CHECKPOINT_DISABLE, value: "1" }
            - { name: PRISMA_HIDE_UPDATE_MESSAGE, value: "1" }
            {{- include "syntra.secretEnv" (dict "name" "DATABASE_URL" "secret" $secret "key" (default .Values.secretKeys.databaseUrl .Values.secretKeys.migrationDatabaseUrl)) | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
