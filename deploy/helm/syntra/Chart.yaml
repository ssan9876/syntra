apiVersion: v2
name: syntra
description: >-
  Syntra identity and access management: API, web console, schema migration
  hook, and optional ingress, autoscaling, network policy, monitoring and
  backup resources.
type: application
# 0.2.0 restructures values (image repository/tag, the secret block); see the
# README's "Upgrading from 0.1" section before upgrading an existing release.
# 0.3.0 defaults to two API replicas. That is only safe with an API image
# that carries migration 20261027173100_replica_safe_state (shared OIDC
# provider generation and rate-limit counters); pin api.replicas=1 when
# deploying an older image with this chart.
#
# The chart published to oci://ghcr.io/ssan9876/charts is packaged by
# .github/workflows/release.yml with version and appVersion both set to the
# release (tag v1.20.0 publishes chart 1.20.0 with appVersion 1.20.0). The two
# values below apply only to installs from this directory.
version: 0.3.0
appVersion: "latest"
kubeVersion: ">=1.27.0-0"
home: https://github.com/ssan9876/syntra
sources:
  - https://github.com/ssan9876/syntra
keywords:
  - iam
  - identity
  - sso
  - scim
maintainers:
  - name: ssan9876
    url: https://github.com/ssan9876
# Read by Artifact Hub. Helm does not use annotations when it renders.
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/ssan9876/syntra
    - name: Documentation
      url: https://github.com/ssan9876/syntra/tree/main/docs
    - name: Chart README
      url: https://github.com/ssan9876/syntra/blob/main/deploy/helm/syntra/README.md
    - name: support
      url: https://github.com/ssan9876/syntra/issues
