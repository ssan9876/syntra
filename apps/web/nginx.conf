server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SAML AND OIDC METADATA ARRIVE AS UPLOADS, and nginx's 1m default refuses
  # them with a 413 the console cannot explain. A single SP or IdP descriptor
  # is a few kilobytes, but the thing operators actually paste in is a
  # federation aggregate -- one document describing every entity in a
  # federation, with a signing certificate each -- and those run to megabytes.
  # 2m clears the aggregates seen in practice while still being a bound: this
  # is an XML document, not a file store, and an unbounded body on a parsing
  # endpoint is its own problem.
  client_max_body_size 2m;

  # Directory-sync and provisioning previews compute a full diff inside one
  # request, and a large source takes longer than nginx's 60s default -- which
  # ends as a 504 while the API is still working and about to answer. The API
  # has its own timeouts; this one exists so nginx is not the shorter of the
  # two.
  proxy_read_timeout 120s;

  # Both of these are also set by the API itself, per response
  # (apps/api/src/plugins/security-headers.ts). Repeated here because THIS
  # server also serves the bundle from disk -- index.html, the JS, the assets
  # -- and those responses never reach the API's onSend hook at all.
  #
  # Deliberately only these two. Content-Security-Policy and X-Frame-Options
  # belong to the API and are NOT set here: it exempts the federation paths
  # (/saml/, /oidc/, /federation/, /wsfed/) from both, because those answer
  # with a self-posting form aimed at another origin. A blanket
  # `form-action 'self'` or `X-Frame-Options: DENY` added at this hop would
  # apply to those responses too, and a blocked SAML POST looks like a blank
  # page rather than an error -- single sign-on would simply stop, with
  # nothing in any log to say why.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Single-page application: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:3000;
    # Syntra selects a tenant from the Host header, so it must survive the
    # hop. Rewriting it here would make every request look like an unknown
    # tenant.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The SAML IdP (registerSamlIdpRoutes, prefix /saml), the OIDC OP and its
  # interaction/token/logout routes (registerOidcRoutes and friends, prefix
  # /oidc -- this also covers /oidc/.well-known/openid-configuration, which
  # oidc-provider serves under the same mount rather than at the bare
  # /.well-known root) and the consuming side of federation (registerFederationRoutes,
  # prefix /federation) are all mounted on the api, not the web app -- so a
  # remote IdP or OP posting back to this origin needs these proxied exactly
  # like /api/, with the same Host and forwarding headers.
  location /saml/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /oidc/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /federation/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # THE THREE BELOW WERE MISSING, and the way they failed is the worst
  # available shape: an unproxied path falls through to `location /` above,
  # which answers `/index.html` with a 200. The caller is told everything
  # worked and handed the console's HTML.
  #
  # For SCIM that means Entra or Okta -- which docs/configure.md tells the
  # operator to point at /scim/v2 -- reading a 200 and a page of markup as a
  # provisioning response, so the connector reports a healthy sync while not
  # one user has been created. For /health/ready it means an orchestrator's
  # readiness probe passing on an API that cannot reach Postgres, which is the
  # exact condition the probe exists to catch. For /metrics it means Prometheus
  # scraping HTML and recording a successful scrape with no samples.
  #
  # A 404 would have been noticed on the first attempt. A 200 was not.

  # Inbound SCIM 2.0 (registerScimRoutes, mounted at /scim/v2). The Host
  # header matters here as much as anywhere else: the machine token presented
  # by the IdP is resolved within a tenant.
  location /scim/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A prefix, not an exact match: this is /health AND /health/ready, and the
  # second is the one docker-compose.yml's healthcheck and any orchestrator
  # actually gate traffic on.
  location /health {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Registered only when METRICS_TOKEN is set, and a 404 from the API when it
  # is not is the intended answer -- a route that replied 403 would confirm
  # its own existence. Proxying is what lets that 404 be the API's own rather
  # than this server's index.html.
  location /metrics {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
