server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page application: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:3000;
    # Syntra selects a tenant from the Host header, so it must survive the
    # hop. Rewriting it here would make every request look like an unknown
    # tenant.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
