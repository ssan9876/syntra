services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: syntra
      # Read by infra/initdb/01-app-role.sh, which creates the syntra_app role
      # this deployment's DATABASE_URL connects as. Required here for the same
      # reason POSTGRES_PASSWORD is: an unset application password has no safe
      # default in production.
      SYNTRA_APP_PASSWORD: ${SYNTRA_APP_PASSWORD:?set SYNTRA_APP_PASSWORD}
    volumes:
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
      - syntra-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syntra']
      interval: 5s
      retries: 20

  api:
    # `image` lets `docker compose up` PULL a published release instead of
    # building one; `build` stays alongside it so `docker compose up --build`
    # still builds from source (Compose prefers a local build to a pull only
    # when --build is passed or the image is missing). Pin an exact release
    # with SYNTRA_VERSION=1.4.0; unset, it pulls :latest.
    image: ghcr.io/ssan9876/syntra-api:${SYNTRA_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://syntra_app:${SYNTRA_APP_PASSWORD:?set SYNTRA_APP_PASSWORD}@postgres:5432/syntra
      PORT: '3000'
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      NODE_ENV: production
      # This deployment IS the proxy: nginx (the `web` service) is the only
      # thing a client ever reaches, and it terminates every connection to
      # `api` from inside the same compose network. `api` publishes no ports,
      # so nothing outside that network can reach it to be believed about
      # anything.
      #
      # These are the private ranges Docker allocates its bridge networks
      # from, which is where nginx's address in that network comes from -- the
      # address is assigned at run time, so it cannot be named exactly here.
      # This was `1` until Fastify 5.12.1 fixed GHSA-3m5p-2c4r-xxw2 by making
      # a hop count trust NOTHING; leaving it would have quietly turned every
      # per-IP rate limit into one global bucket. Never a bare `true`, which
      # would believe X-Forwarded-For from any client. See TRUST_PROXY's own
      # documentation in packages/core/src/config.ts and .env.example.
      TRUST_PROXY: '172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16'
    healthcheck:
      # READINESS, not /health: a liveness check that only proves the process
      # is listening would report the api "healthy" while it cannot reach
      # Postgres, and `web`'s `condition: service_healthy` below exists
      # precisely to stop that from serving traffic. No curl/wget in the
      # node:22-alpine runtime image, so this uses Node's own fetch rather
      # than adding a package to the runtime stage just for a healthcheck.
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    # See the api service's comment above: image for pull-and-run, build kept
    # for --build. Same tag, same default.
    image: ghcr.io/ssan9876/syntra-web:${SYNTRA_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # LOOPBACK ONLY, and the `127.0.0.1:` is the whole point.
    #
    # docs/install.md tells the operator to put their own TLS in front of
    # :8080 (Caddy, Traefik, a load balancer). A bare `8080:80` binds every
    # interface, so the plaintext origin stayed reachable from the network
    # BESIDE the proxy -- and anything that reached it directly bypassed TLS
    # entirely. For an IAM product that is the session cookie, the SAML POST
    # carrying an assertion and the OIDC authorization code, all in the clear,
    # with the deployment looking correctly configured from the outside.
    #
    # A proxy on this host reaches 127.0.0.1:8080 exactly as before. A proxy
    # on ANOTHER host cannot, which is deliberate: that arrangement needs a
    # published port, and republishing it is a decision to make on purpose --
    # see docker-compose.tls.yml, which does exactly that for Caddy.
    ports: ['127.0.0.1:8080:80']
    depends_on:
      api:
        condition: service_healthy

volumes:
  syntra-data:
