[Unit]
After=syntra-infra.service
Requires=syntra-infra.service

[Service]
# Even with the ordering above, "the container has started" is not "PostgreSQL
# is accepting connections". The API tolerates a missing database by starting
# anyway with no jobs scheduled — which is a quiet failure, so it is caught here.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do docker exec infra-postgres-1 pg_isready -U syntra -d syntra >/dev/null 2>&1 && exit 0; sleep 2; done; echo "postgres never became ready" >&2; exit 1'
