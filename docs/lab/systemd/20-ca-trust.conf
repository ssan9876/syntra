[Service]
# Node does NOT use the system CA store. `update-ca-certificates` puts the lab
# CA where openssl and curl will find it, and Node carries its own bundled
# Mozilla list regardless — so LDAPS to the domain controller failed with
# "unable to verify the first certificate" while `openssl s_client` against the
# same host verified cleanly. This is the only way to add a private CA to Node
# short of disabling verification, which is what the alternative would have
# been and is not a trade worth making for a directory bind.
Environment=NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/example-ca.crt
