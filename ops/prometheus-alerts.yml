groups:
  - name: syntra-enterprise-operations
    rules:
      - alert: SyntraNotReady
        expr: syntra_readiness == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Syntra is not ready to serve identity traffic
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraSchedulerDown
        expr: syntra_scheduler_running == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The background scheduler has not started; no lifecycle, sync or notification work is running
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraLifecycleWorkOverdue
        expr: syntra_lifecycle_operations_overdue > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Syntra has unacknowledged lifecycle work past its due time
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraLifecycleServiceLevelBreached
        expr: syntra_lifecycle_operations_slo_breached > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A lifecycle operation (an urgent departure, typically) is past its service-level deadline and unresolved
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/tabletop-exercises.md
      - alert: SyntraLifecycleWorkFailed
        expr: syntra_lifecycle_operations_failed > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Syntra has failed lifecycle operations requiring recovery
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/target-rollback.md
      - alert: SyntraLifecycleApprovalsWaiting
        expr: syntra_lifecycle_operations_awaiting_approval > 0
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: Lifecycle work has waited more than four hours for a second person to approve it
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraLifecycleBacklogAging
        expr: syntra_lifecycle_oldest_unresolved_age_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: The oldest unresolved lifecycle operation is more than two days old
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraTenantSaturated
        expr: syntra_lifecycle_receipts_deferred > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Target operations have been deferred by the tenant concurrency cap for fifteen minutes
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraProvisioningRunsFailing
        expr: syntra_provision_runs_failed_24h > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A provisioning run failed in the last day (expired credential, unreachable target, unreadable rule)
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/target-rollback.md
      - alert: SyntraProvisioningRetriesExhausted
        expr: syntra_provision_actions_pending_retry > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Provisioning actions exhausted their retries and are waiting for the next run
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/target-rollback.md
      - alert: SyntraTargetStale
        expr: syntra_targets_stale > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: An enabled, scheduled target has not run in a day
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/target-rollback.md
      - alert: SyntraReadinessEvidenceStale
        expr: syntra_target_readiness_age_seconds > 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: A target's connection has not been tested in a week; its readiness evidence is stale
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/secret-rotation.md
      - alert: SyntraUndeliveredLogout
        expr: syntra_logout_deliveries_abandoned > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Syntra could not deliver one or more back-channel logouts
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraUndeliveredWebhook
        expr: syntra_webhook_deliveries_abandoned > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Webhook deliveries have exhausted their retries
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
      - alert: SyntraSigningKeyExpiring
        expr: syntra_signing_key_expires_in_seconds < 604800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: The nearest signing key expires within a week
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/secret-rotation.md
      - alert: SyntraJobQueueDeep
        expr: syntra_jobs_pending > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than five hundred background jobs are waiting; the scheduler is not keeping up
          runbook: https://github.com/ssan9876/syntra/blob/main/docs/runbooks/incident-response.md
